<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulačky: úver, hypotéka a sporenie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#F6F4EE;color:#1B2A27}
main{max-width:1440px;margin:0 auto;padding:40px 32px 56px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
h1{margin:0 0 6px;font-size:34px;font-weight:800;letter-spacing:-.5px}
header p{margin:0;font-size:16px;color:#4A5550;max-width:760px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;align-items:start}
.card{background:#fff;border:1px solid #E3DFD3;border-radius:16px;overflow:hidden}
.card.m{--c:#1F3A5F;--t:#E8EEF6;--d:#1F3A5F}
.card.h{--c:#7A3B5E;--t:#F3E8EF;--d:#5E2B47}
.card.c{--c:#2F6F62;--t:#E6F1EE;--d:#24574C}
.card.s{--c:#B9852B;--t:#F6EEDC;--d:#6B4A0E}
.head{border-top:6px solid var(--c);padding:20px 24px 16px}
.head h2{margin:0 0 4px;font-size:20px;font-weight:800}
.head span{font-size:13px;color:#4A5550}
.body{padding:0 24px 24px;display:flex;flex-direction:column;gap:14px}
.inputs{display:flex;flex-direction:column;gap:14px}
@media (min-width:1000px){.inputs{min-height:400px}}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3B4540;font-weight:600;min-width:0}
.fld{display:flex;align-items:center;gap:8px;border:1px solid #BDB8A8;border-radius:10px;background:#fff;height:44px;padding:0 14px}
.fld:focus-within{border-color:#1B2A27;box-shadow:0 0 0 3px rgba(27,42,39,.18)}
.fld input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:#1B2A27;text-align:right}
.u{color:#4A5550;font-weight:500;min-width:30px}
select,input[type=date],.ex-amt{height:44px;border:1px solid #BDB8A8;border-radius:10px;background:#fff;font:inherit;font-size:16px;color:#1B2A27;padding:0 10px;min-width:0}
.pair{display:flex;gap:10px}.pair>label{flex:1}
.pay{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;font-size:13px;color:#3B4540;font-weight:600}
.pay b{font-size:18px;font-weight:800;color:var(--d)}
.hero{background:var(--t);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.hero span{font-size:13px;font-weight:600;color:var(--d)}
.hero b{font-size:28px;font-weight:800;color:var(--d)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-top:1px solid #EEEBE1;padding-top:10px}
.row span{color:#4A5550}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#E3DFD3}
.barl{display:flex;justify-content:space-between;font-size:12px;color:#4A5550;margin-top:4px}
.ex{border-top:1px solid #EEEBE1;padding-top:16px;display:flex;flex-direction:column;gap:12px}
.ex h3{margin:0;font-size:15px;font-weight:800}
.exi{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#FAF8F3;border-radius:10px;padding:10px;margin-bottom:12px}
.exi label{flex:1 1 130px;font-size:12px;gap:4px}
.exi .ex-amt{text-align:right}
.exi button{width:44px;height:44px;border:1px solid #BDB8A8;border-radius:10px;background:#fff;color:var(--c);font-size:22px;line-height:1;cursor:pointer}
.add{height:44px;border:1px solid var(--c);border-radius:10px;background:#fff;color:var(--d);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.note{margin:4px 0 0;font-size:12px;line-height:1.5;color:#5A645F}
footer{font-size:12px;color:#5A645F}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>Úver, hypotéka a sporenie</h1>
<p>Štyri nezávislé kalkulačky vedľa seba. Zmeňte ľubovoľné číslo a výsledky sa prepočítajú hneď.</p>
</div>
<label style="width:140px">Mena
<select data-k="cur"><option>Kč</option><option>€</option></select>
</label>
</header>
<div class="cards" id="cards"></div>
<footer>Výpočty sú orientačné a nenahrádzajú ponuku banky ani finančné poradenstvo.</footer>
</main>
<script>
const S = {
cur: 'Kč',
m: { loan: '500000', rate: '7,9', years: '5', start: '2026-11-01', mode: 'shorten', ex: [{ date: '2027-06-01', amount: '100000' }] },
h: { price: '5000000', own: '1000000', rate: '5,2', years: '30', start: '2026-11-01', mode: 'shorten', ex: [{ date: '2029-01-01', amount: '500000' }] },
c: { dep: '1000000', rate: '1,5', years: '8', tax: '15' },
s: { dep: '1000000', rate: '3,8', n: '8', unit: 'years', freq: '12', tax: '15' }
};
const num = (v) => { const x = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(x) && x > 0 ? x : 0; };
const f = (x) => (isFinite(x) ? Math.round(x) : 0).toLocaleString('sk-SK');
const p = (x) => (isFinite(x) ? x : 0).toLocaleString('sk-SK', { maximumFractionDigits: 2 });
const rows = (a) => a.map((r) => `<div class="row"><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('');
const out = (k, v) => { document.querySelector(`[data-o="${k}"]`).innerHTML = v; };
const cur = () => S.cur;

const field = (label, k, unit) => `<label>${label}<span class="fld"><input type="text" inputmode="decimal" data-k="${k}"><span class="u${unit === 'cur' ? ' cur' : ''}">${unit === 'cur' ? S.cur : unit}</span></span></label>`;
const hero = (label, o) => `<div class="hero"><span>${label}</span><b data-o="${o}"></b></div>`;
const shell = (id, title, sub, body) => `<section class="card ${id}"><div class="head"><h2>${title}</h2><span>${sub}</span></div><div class="body">${body}</div></section>`;

const loanCard = (id, title, sub, fields, bar, formula) => shell(id, title, sub, `
<div class="inputs">${fields}<div class="pay">Mesačná splátka<b data-o="${id}Pay"></b></div></div>
${hero('Zaplatené celkom', id + 'Total')}
${bar ? `<div><div class="bar"><div data-o="${id}B1" style="background:#1F3A5F"></div><div data-o="${id}B2" style="background:#C0562F"></div></div><div class="barl"><span data-o="${id}L1"></span><span data-o="${id}L2"></span></div></div>` : ''}
<div data-o="${id}Rows" style="display:flex;flex-direction:column;gap:14px"></div>
<div class="ex"><h3>Mimoriadne splátky</h3>
<label>Začiatok splácania<input type="date" data-k="${id}.start"></label>
<label>Po mimoriadnej splátke<select data-k="${id}.mode"><option value="shorten">skrátiť dobu splácania</option><option value="reduce">znížiť mesačnú splátku</option></select></label>
<div id="exl-${id}"></div>
<button type="button" class="add" data-add="${id}">Pridať mimoriadnu splátku</button></div>
<p class="note">${formula}</p>`);

const FORM = 'Vzorec: M = U · i / (1 − (1 + i)<sup>−N</sup>), kde U je výška úveru, i = úrok p.a. / 12 a N počet mesiacov. Mimoriadna splátka sa odpočíta od zostatku po poslednej riadnej splátke pred zadaným dátumom.';
const cards = [
loanCard('m', 'Klasický úver', 'Anuitná splátka, mesačne',
field('Výška úveru', 'm.loan', 'cur') + field('Úroková sadzba p.a.', 'm.rate', '%') + field('Doba splácania', 'm.years', 'rokov'), true, FORM),
loanCard('h', 'Hypotéka', 'Anuita s mimoriadnymi splátkami',
field('Cena nehnuteľnosti', 'h.price', 'cur') + field('Vlastné zdroje', 'h.own', 'cur') + field('Úroková sadzba p.a.', 'h.rate', '%') + field('Doba splácania', 'h.years', 'rokov'), false, FORM),
shell('c', 'Klasický sporiaci účet', 'Jednoduché úročenie', `
<div class="inputs">${field('Vložená suma', 'c.dep', 'cur') + field('Úroková sadzba p.a.', 'c.rate', '%') + field('Doba sporenia', 'c.years', 'rokov') + field('Výška dane', 'c.tax', '%')}</div>
${hero('Zostatok po zdanení', 'cNet')}
<div data-o="cRows" style="display:flex;flex-direction:column;gap:14px"></div>
<p class="note">Vzorec: Úrok = V · p/100 · t, kde V je vklad, p úrok p.a. a t doba v rokoch. Daň = úrok · sadzba dane. Úrok sa nepripisuje k vkladu.</p>`),
shell('s', 'Zložené úročenie', 'Jednorazovo vložená suma', `
<div class="inputs">${field('Vložená suma', 's.dep', 'cur') + field('Úroková sadzba p.a.', 's.rate', '%')}
<div class="pair"><label>Splatnosť<span class="fld"><input type="text" inputmode="decimal" data-k="s.n"></span></label>
<label>Jednotka<select data-k="s.unit"><option value="years">rokov</option><option value="months">mesiacov</option></select></label></div>
<label>Frekvencia pripisovania úrokov<select data-k="s.freq"><option value="365">denne</option><option value="52">týždenne</option><option value="12">mesačne</option><option value="4">štvrťročne</option><option value="2">polročne</option><option value="1">ročne</option></select></label>
${field('Výška dane', 's.tax', '%')}</div>
${hero('Našetrená suma celkom', 'sGross')}
<div data-o="sRows" style="display:flex;flex-direction:column;gap:14px"></div>
<p class="note">Vzorec: K = V · (1 + p/m)<sup>m·t</sup>, kde m je počet pripísaní za rok. Po zdanení sa použije sadzba p · (1 − daň), čiže daň sa strháva pri každom pripísaní úroku.</p>`)
];
document.getElementById('cards').innerHTML = cards.join('');

const get = (path) => path.split('.').reduce((o, k) => o[k], S);
const setPath = (path, v) => { const a = path.split('.'); const last = a.pop(); a.reduce((o, k) => o[k], S)[last] = v; };
document.querySelectorAll('[data-k]').forEach((el) => { el.value = get(el.dataset.k); });

function renderEx(id) {
document.getElementById('exl-' + id).innerHTML = S[id].ex.map((x, i) => `<div class="exi">
<label>Dátum<input type="date" value="${x.date}" data-ex="${id}" data-i="${i}" data-f="date"></label>
<label>Suma (<span class="cur">${S.cur}</span>)<input type="text" inputmode="decimal" class="ex-amt" value="${x.amount}" data-ex="${id}" data-i="${i}" data-f="amount"></label>
<button type="button" aria-label="Odstrániť mimoriadnu splátku" data-del="${id}" data-i="${i}">×</button></div>`).join('');
}

function sim(loan, N, i, startStr, mode, list) {
let st = new Date(startStr + 'T00:00:00');
if (isNaN(st)) st = new Date();
const ann = (b, k) => k > 0 ? (i > 0 ? b * i / (1 - Math.pow(1 + i, -k)) : b / k) : 0;
const pay = ann(loan, N), mp = {};
list.forEach((e) => {
const a = num(e.amount), D = new Date(e.date + 'T00:00:00');
if (isNaN(D) || a <= 0) return;
let d = (D.getFullYear() - st.getFullYear()) * 12 + D.getMonth() - st.getMonth();
if (D.getDate() < st.getDate()) d--;
d = Math.max(0, d);
if (d < N) mp[d] = (mp[d] || 0) + a;
});
let b = loan, pm = pay, paid = 0, intr = 0, ex = 0, mo = 0;
const ap = (k) => {
const x = Math.min(mp[k] || 0, b);
if (x > 0) { b -= x; paid += x; ex += x; if (mode === 'reduce' && b > 0.005) pm = ann(b, N - k); }
};
ap(0);
for (let k = 1; k <= N && b > 0.005; k++) {
const it = b * i, pr = Math.min(pm - it, b);
b -= pr; paid += pr + it; intr += it; mo = k; ap(k);
}
const end = new Date(st.getTime());
end.setMonth(end.getMonth() + mo);
return { pay, paid, intr, ex, mo, end, pm, base: pay * N - loan };
}

function calcLoan(id) {
const d = S[id], c = S.cur;
const loan = id === 'h' ? Math.max(0, num(d.price) - num(d.own)) : num(d.loan);
const N = Math.round(num(d.years) * 12), i = num(d.rate) / 1200;
const r = sim(loan, N, i, d.start, d.mode, d.ex);
out(id + 'Pay', f(r.pay) + ' ' + c);
out(id + 'Total', f(r.paid) + ' ' + c);
const list = [['Výška úveru', f(loan) + ' ' + c]];
if (id === 'h') list.push(['Podiel úveru na cene (LTV)', p(num(d.price) > 0 ? loan / num(d.price) * 100 : 0) + ' %']);
list.push(['Úroky celkom', f(r.intr) + ' ' + c], ['Úspora na úrokoch', f(Math.max(0, r.base - r.intr)) + ' ' + c], ['Mimoriadne splátky spolu', f(r.ex) + ' ' + c]);
if (d.mode === 'reduce' && r.ex > 0) list.push(['Mesačná splátka po mimoriadnych', f(r.pm) + ' ' + c]);
list.push(['Skutočná doba splácania', Math.floor(r.mo / 12) + ' r. ' + (r.mo % 12) + ' mes.'], ['Dátum poslednej splátky', r.mo > 0 ? r.end.toLocaleDateString('sk-SK') : '-']);
out(id + 'Rows', rows(list));
if (id === 'm') {
const ip = r.paid > 0 ? r.intr / r.paid * 100 : 0;
document.querySelector('[data-o="mB1"]').style.width = (100 - ip) + '%';
document.querySelector('[data-o="mB2"]').style.width = ip + '%';
out('mL1', 'Istina ' + p(100 - ip) + ' %');
out('mL2', 'Úrok ' + p(ip) + ' %');
}
}

function calc() {
const c = S.cur;
document.querySelectorAll('.cur').forEach((el) => { el.textContent = c; });
calcLoan('m'); calcLoan('h');
const k = S.c, dep = num(k.dep), g = dep * num(k.rate) / 100 * num(k.years), tax = g * num(k.tax) / 100;
out('cNet', f(dep + g - tax) + ' ' + c);
out('cRows', rows([['Zostatok pred zdanením', f(dep + g) + ' ' + c], ['Úrok pred zdanením', f(g) + ' ' + c], ['Daň z úroku', f(tax) + ' ' + c], ['Úrok po zdanení', f(g - tax) + ' ' + c]]));
const z = S.s, sd = num(z.dep), sr = num(z.rate) / 100, tx = num(z.tax) / 100, m = Number(z.freq);
const t = z.unit === 'months' ? num(z.n) / 12 : num(z.n);
const grow = (rate) => sd * Math.pow(1 + rate / m, m * t);
const gross = grow(sr), net = grow(sr * (1 - tx));
out('sGross', f(gross) + ' ' + c);
out('sRows', rows([['Suma po odpočítaní dane', f(net) + ' ' + c], ['Výnos úrokov pred daňou', f(gross - sd) + ' ' + c], ['Výnos úrokov po dani', f(net - sd) + ' ' + c], ['Efektívny ročný výnos (pred daňou)', p((Math.pow(1 + sr / m, m) - 1) * 100) + ' %']]));
}

const onEdit = (e) => {
const t = e.target;
if (t.dataset.k) setPath(t.dataset.k, t.value);
else if (t.dataset.ex) S[t.dataset.ex].ex[+t.dataset.i][t.dataset.f] = t.value;
else return;
calc();
};
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
document.addEventListener('click', (e) => {
const a = e.target.closest('[data-add]'), d = e.target.closest('[data-del]');
if (a) { const id = a.dataset.add; S[id].ex.push({ date: S[id].start, amount: '' }); renderEx(id); calc(); }
if (d) { S[d.dataset.del].ex.splice(+d.dataset.i, 1); renderEx(d.dataset.del); calc(); }
});
renderEx('m'); renderEx('h'); calc();
</script>
</body>
</html>
